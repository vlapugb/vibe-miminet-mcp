[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "miminet-mcp"
version = "0.1.0"
description = "Control the Miminet network editor through MCP over stdio"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "playwright==1.63.0",
    "pydantic>=2,<3",
]

[project.scripts]
miminet-mcp = "miminet_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
