name: Test Miminet MCP
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out the tested Miminet revision
        run: |
          git init "$RUNNER_TEMP/miminet"
          git -C "$RUNNER_TEMP/miminet" fetch --depth=1 https://git.sourcecraft.dev/miminet/miminet.git 987515cdda6c60b994391a60814946cf1adba3ae
          git -C "$RUNNER_TEMP/miminet" checkout --detach FETCH_HEAD
      - name: Install MCP, Firefox and the test frontend
        run: |
          python -m pip install uv
          uv pip install --system -r requirements.txt -r "$RUNNER_TEMP/miminet/front/pyproject.toml" pytest
          python -m playwright install --with-deps firefox
      - name: Test MCP over stdio and in the editor
        run: MIMINET_SOURCE="$RUNNER_TEMP/miminet" python -m pytest -q test_server.py
